<div class="page">
  <h1 class="title">{{ ui().pages.deletePage.quizTemplateTitle }}</h1>

  <div class="card">
    @if (error()) {
      <p class="muted">{{ error() }}</p>
    } @else if (template()) {
      <p>{{ ui().pages.deletePage.confirmPrefix }} <b>{{ template()!.title }}</b>{{ ui().pages.deletePage.confirmSuffix }}</p>

      <div class="actions">
        <p-button
          (onClick)="confirm()"
          icon="pi pi-trash"
          [label]="ui().common.delete"
          severity="danger"
          type="button">
        </p-button>

        <p-button
          (onClick)="goBack()"
          icon="pi pi-times"
          [label]="ui().common.cancel"
          severity="secondary"
          type="button">
        </p-button>
      </div>
    } @else {
      <p class="muted">{{ ui().common.loading }}</p>
    }
  </div>
</div>
