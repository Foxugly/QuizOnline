<app-auth-card icon="pi pi-user-plus" [title]="ui().register.title" [wide]="true">
  @if (loadingLanguages() || loadingDomains()) {
    <p class="muted">{{ ui().register.loading }}</p>
  } @else {
    <form (ngSubmit)="onSubmit()" [formGroup]="form" class="register-form">
      <div class="register-grid">
        <div class="field field--full">
          <label for="email">{{ ui().register.email }}</label>
          <input id="email" pInputText type="email" formControlName="email" autocomplete="email" autofocus>
          <app-field-error
            [control]="f['email']"
            [errors]="{required: ui().register.emailRequired, email: ui().register.emailInvalid}"
            [showWhenUntouched]="submitted()" />
        </div>

        <div class="field">
          <label for="first_name">{{ ui().register.firstName }}</label>
          <input id="first_name" pInputText type="text" formControlName="first_name" autocomplete="given-name">
          <app-field-error
            [control]="f['first_name']"
            [errors]="{required: ui().register.firstNameRequired}"
            [showWhenUntouched]="submitted()" />
        </div>

        <div class="field">
          <label for="last_name">{{ ui().register.lastName }}</label>
          <input id="last_name" pInputText type="text" formControlName="last_name" autocomplete="family-name">
          <app-field-error
            [control]="f['last_name']"
            [errors]="{required: ui().register.lastNameRequired}"
            [showWhenUntouched]="submitted()" />
        </div>

        <div class="field">
          <label for="language">{{ ui().register.language }}</label>
          <p-select inputId="language" formControlName="language" [options]="languages()" optionLabel="name" optionValue="code" [placeholder]="ui().register.chooseLanguage" [showClear]="true" [filter]="true" fluid></p-select>
          <app-field-error
            [control]="f['language']"
            [errors]="{required: ui().register.languageRequired}"
            [showWhenUntouched]="submitted()" />
        </div>

        <div class="field">
          <label for="requested_domain_ids">{{ ui().register.domains }}</label>
          <p-multiselect
            inputId="requested_domain_ids"
            formControlName="requested_domain_ids"
            [options]="domainOptions"
            optionLabel="label"
            optionValue="value"
            [placeholder]="ui().register.chooseDomains"
            [filter]="true"
            [showClear]="true"
            display="chip"
            fluid>
          </p-multiselect>
          <small class="field__hint">{{ ui().register.domainsHint }}</small>
        </div>

        <div class="field">
          <label for="password">{{ ui().register.password }}</label>
          <p-password inputId="password" formControlName="password" [toggleMask]="true" [feedback]="false" autocomplete="new-password" fluid></p-password>
          <app-field-error
            [control]="f['password']"
            [errors]="{required: ui().register.passwordRequired, minlength: ui().register.passwordMin}"
            [showWhenUntouched]="submitted()" />
        </div>

        <div class="field">
          <label for="confirm_password">{{ ui().register.confirmPassword }}</label>
          <p-password inputId="confirm_password" formControlName="confirm_password" [toggleMask]="true" [feedback]="false" autocomplete="new-password" fluid></p-password>
          <app-field-error
            [control]="f['confirm_password']"
            [errors]="{required: ui().register.confirmRequired, passwordMismatch: ui().register.passwordMismatch}"
            [showWhenUntouched]="submitted()" />
        </div>
      </div>

      @if (errorMessage()) {
        <p-message severity="error">{{ errorMessage() }}</p-message>
      }

      @if (turnstile.enabled) {
        <div #turnstile class="turnstile-widget"></div>
      }

      <p-button
        type="submit"
        class="w-full"
        styleClass="w-full"
        icon="pi pi-user-plus"
        [label]="ui().register.createAccount"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting() || form.invalid"
      ></p-button>
    </form>
  }

  <div class="auth-footer">
    <span class="muted">{{ ui().register.haveAccount }}</span>
    <a routerLink="/login" class="link">{{ ui().login.submit }}</a>
  </div>
</app-auth-card>
