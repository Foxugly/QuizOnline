name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Full backend suite via pytest. pytest.ini's ``testpaths = .`` auto-discovers
    # EVERY app's tests — both pytest-style (course / lesson / enrollment /
    # certificate / assessment / block / connectionlog) and unittest-style
    # (core / customuser / quiz / language / domain / subject / question /
    # translation / config). This replaces the old hand-partitioned
    # ``manage.py test <app>.tests`` jobs whose app lists silently omitted the
    # entire pytest-based LMS core — those ~hundreds of tests never ran in CI.
    # Auto-discovery is the anti-drift guarantee: a new app's tests can no longer
    # be forgotten by nobody updating a module list.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizonline-server
    # La suite tournait sur SQLite alors que la production tourne sur
    # PostgreSQL 16. SQLite est plus permissif, et cet ecart a laisse passer un
    # crash en production : SELECT DISTINCT ... FOR UPDATE, accepte par SQLite,
    # refuse par PostgreSQL (QUIZONLINE-BACKEND-9, PR #152). 1194 tests verts
    # ne l'avaient jamais vu. On aligne donc la CI sur le moteur de prod.
    # Aucun changement de code : settings_base lit DATABASE_URL et retombe sur
    # SQLite quand la variable est absente (dev local inchange).
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=quizonline \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend test suite (pytest + coverage gate)
        env:
          DJANGO_ENV: test
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/quizonline
        # Coverage config (source + omit) lives in .coveragerc. The suite sits
        # around 85%; the 82% floor is a ratchet that catches a real regression
        # without flapping on small legitimate dips. Raise it as coverage grows.
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=82

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizonline-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend lint
        run: ruff check . --exclude migrations

      - name: Check backend migrations are up to date
        env:
          DJANGO_ENV: dev
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
        run: python manage.py makemigrations --check --dry-run

      - name: Generate OpenAPI
        env:
          DJANGO_ENV: dev
          SECRET_KEY: ci-secret-key
          DEBUG: "False"
        run: python manage.py spectacular --file openapi.yaml

      - name: Run deploy checks
        env:
          DJANGO_ENV: prod
          SECRET_KEY: ci-secret-key
          # settings_prod requires JWT_SIGNING_KEY and refuses to boot if it
          # matches SECRET_KEY (the runtime guard added in commit 06d148c).
          JWT_SIGNING_KEY: ci-jwt-signing-key-distinct-from-secret
          ALLOWED_HOSTS: ci.local
          # settings_prod uses the fleet DB_* 6-var convention (OPERATIONS.md
          # §3.13); DB_ENGINE + DB_NAME are required. `check --deploy` does not
          # open a connection, so sqlite placeholders are enough here.
          DB_ENGINE: sqlite3
          DB_NAME: ci.sqlite3
          DATABASE_URL: sqlite:///ci.sqlite3
          FRONTEND_BASE_URL: https://ci.local
          DEFAULT_FROM_EMAIL: ci@quizonline.test
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          CSRF_TRUSTED_ORIGINS: https://ci.local
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quizonline-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: quizonline-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run i18n completeness check
        run: npm run check:i18n

      - name: Run unit tests (with coverage gate)
        # Coverage config (exclusions + thresholds) lives in angular.json's
        # ``coverage`` configuration. Generated API client + specs are excluded;
        # the suite sits ~37% statements, thresholds are set a few points under
        # as a ratchet against dropping tests. Raise them as coverage grows.
        run: npm run test:coverage

      - name: Run production build
        run: npm run build

      - name: Report bundle size
        # Surfaces the post-build inventory in CI logs so size
        # regressions are visible BEFORE they trip ng's own
        # ``maximumError`` budget (1.2 MB initial). Non-blocking.
        run: npm run report:bundle-size

      - name: Run e2e tests
        run: npm run test:e2e

  e2e-fullstack:
    # Real Angular ↔ DRF integration: Playwright boots the actual Django backend
    # (scripts/run-fullstack-backend.sh) + ng serve and drives the SPA. Previously
    # this suite only ran locally on Windows, so no integration regression was
    # gated in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: quizonline-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: quizonline-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: quizonline-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: quizonline-frontend
        run: npx playwright install --with-deps chromium

      - name: Run fullstack e2e (real Django backend)
        working-directory: quizonline-frontend
        run: npm run test:e2e:fullstack

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-fullstack-report
          path: quizonline-frontend/playwright-report/
          retention-days: 7

  contract:
    runs-on: ubuntu-latest
    needs:
      - backend
      - backend-quality
      - frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: quizonline-frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r quizonline-server/requirements.txt
          cd quizonline-frontend
          npm ci

      # Le CLI télécharge le JAR du générateur (version figée dans
      # openapitools.json) depuis Maven Central à chaque exécution ; une erreur
      # réseau faisait échouer le job. Le JAR vit dans le cache d'Actions (clé =
      # openapitools.json, donc une nouvelle version = un nouveau cache) et, sans
      # cache, le téléchargement est tenté trois fois.
      - name: JAR du générateur OpenAPI depuis le cache
        id: cache-openapi-jar
        uses: actions/cache/restore@v6
        with:
          path: quizonline-frontend/node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-jar-${{ hashFiles('quizonline-frontend/openapitools.json') }}

      - name: JAR du générateur OpenAPI depuis Maven Central (si absent du cache)
        id: telechargement-openapi-jar
        if: steps.cache-openapi-jar.outputs.cache-hit != 'true'
        working-directory: quizonline-frontend
        run: |
          for essai in 1 2 3; do
            # `version` télécharge la version figée (7.21.0) si le JAR manque, puis l'affiche.
            if npx openapi-generator-cli version; then
              echo "neuf=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 10))
          done
          echo "::error::Maven Central indisponible et aucun JAR en cache."
          exit 1

      - name: Mettre le JAR du générateur OpenAPI en cache
        if: steps.telechargement-openapi-jar.outputs.neuf == 'true'
        uses: actions/cache/save@v6
        with:
          path: quizonline-frontend/node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-jar-${{ hashFiles('quizonline-frontend/openapitools.json') }}

      - name: Regenerate OpenAPI and frontend client
        shell: pwsh
        run: ./scripts/sync-openapi.ps1

      - name: Ensure generated artifacts are committed
        run: git diff --exit-code -- quizonline-server/openapi.yaml quizonline-frontend/openapi.yaml quizonline-frontend/src/app/api/generated

  # Audit des dépendances Python contre la base d'avis PyPI (OSV) : le job échoue
  # sur toute vulnérabilité connue. pip-audit résout l'arbre complet, dépendances
  # transitives comprises, dans un venv jetable ; outil épinglé, cache pip.
  # Exceptions : quizonline-server/.pip-audit-ignore, une ligne « ID AAAA-MM-JJ # raison » ;
  # une exception expirée fait échouer le job — à réexaminer, pas à oublier.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quizonline-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quizonline-server/requirements*.txt

      - name: Install pip-audit (version figée)
        run: python -m pip install pip-audit==2.10.1

      - name: Audit des dépendances
        run: |
          ignore=()
          if [ -f .pip-audit-ignore ]; then
            today=$(date -u +%F)
            while read -r id expiry _ || [ -n "$id" ]; do
              case "$id" in ''|'#'*) continue ;; esac
              if [[ ! "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::.pip-audit-ignore : date d'expiration manquante pour $id"; exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "::error::.pip-audit-ignore : l'exception $id a expiré le $expiry"; exit 1
              fi
              ignore+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          pip-audit --progress-spinner off -r requirements.txt "${ignore[@]}"
