# Rate-limit zones — `http` context.
#
# Installed by the deploy (root, from the committed git blob, like the vhost) as
# /etc/nginx/conf.d/quizonline-limits.conf, together with the vhost: nginx
# refuses a vhost that names an unknown zone (`nginx -t`). A zone cannot be
# declared inside a `server` block, hence this separate file.
#
# `quizonline_admin_login` guards /admin/login/, a plain Django view that the
# DRF throttles (THROTTLE_TOKEN_OBTAIN on /api/v1/token/) do not cover.
# 10r/m per IP: far above human use, far below what a password-guessing run
# needs (same model as poker-limits.conf / billing-limits.conf).
limit_req_zone $binary_remote_addr zone=quizonline_admin_login:10m rate=10r/m;
